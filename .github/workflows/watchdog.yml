# Watchdog: alert if the daily run hasn't completed by 12:00 New York time (POL-09 statement 18).
# Checks for today's run record; a failed watchdog run emails the maintainer. No Google sign-in needed.
# Limit: it runs on the same GitHub scheduler as the daily run, so a scheduler outage silences both
# (see GOV-123; a Google-side backup alert is to be decided after checking its cost).

name: Watchdog (daily run)

on:
  schedule:
    - cron: "5 16 * * *"   # 12:05 New York in summer (EDT)
    - cron: "5 17 * * *"   # 12:05 New York in winter (EST); the script ignores whichever doesn't apply
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check today's run record
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: python3 data-platform/src/ect_platform/watchdog.py
