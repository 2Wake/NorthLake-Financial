# Daily data refresh: generate and load new days into BigQuery, rebuild dbt, keep a run record.
# Signs in to Google Cloud keylessly (Workload Identity Federation): no keys stored anywhere.
# Setup steps: data-platform/docs/github-actions-setup.md

name: Daily data refresh

on:
  schedule:
    # 05:17 UTC = 00:17 New York (01:17 in summer), always after NY midnight, so "yesterday" is a complete day.
    # Off the hour on purpose: GitHub delays busy top-of-hour schedules. It started the old 10:30 UTC schedule
    # about 9.5 hours late (11-25, 11-26), after the 12:00 deadline; from 05:17 the same delay still finishes by
    # about 10:00 New York (GOV-123). GitHub never starts early, so the run can't fall before NY midnight.
    - cron: "17 5 * * *"
    # Backup starts. GitHub may delay a schedule by hours or drop it (it skipped 11-27 entirely, GOV-123).
    # The "check" job below stops a backup straight away if today's refresh already succeeded.
    - cron: "17 8 * * *"    # 03:17 New York (04:17 in summer)
    - cron: "17 11 * * *"   # 06:17 New York (07:17 in summer)
  workflow_dispatch:         # "Run workflow" button on the Actions tab: always runs in full

permissions:
  contents: write   # commit the run record
  id-token: write   # keyless sign-in to Google Cloud
  actions: read     # the check job reads earlier runs of this workflow

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  check:
    # Did a run of this workflow already refresh today (New York date)? "Refreshed" means its dbt step
    # succeeded. The run's overall result isn't used, because it fails on purpose when the security
    # review raises alerts. Runs queue one at a time (concurrency below), so a backup that waited behind
    # a full run sees it here and stops. Manual runs always go ahead.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, subprocess, zoneinfo
          ny = zoneinfo.ZoneInfo("America/New_York")
          today = datetime.datetime.now(ny).date()
          repo, me = os.environ["REPO"], int(os.environ["RUN_ID"])

          def gh(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))

          done = None
          if os.environ["EVENT"] == "schedule":
              runs = gh(f"repos/{repo}/actions/workflows/daily-refresh.yml/runs?per_page=30")["workflow_runs"]
              for r in runs:
                  started = datetime.datetime.fromisoformat(r["run_started_at"].replace("Z", "+00:00"))
                  if r["id"] == me or started.astimezone(ny).date() != today:
                      continue
                  jobs = gh(f"repos/{repo}/actions/runs/{r['id']}/jobs")["jobs"]
                  if any(s["name"] == "Build and test (dbt)" and s["conclusion"] == "success"
                         for j in jobs for s in j.get("steps", [])):
                      done = r["id"]
                      break
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'false' if done else 'true'}\n")
          print(f"Today ({today}) was already refreshed by run {done}: skipping." if done
                else f"No successful refresh yet today ({today}): running.")
          PY

  refresh:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Google Cloud (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Generator tests
        run: uv run pytest -q

      - name: Generate and load new days
        run: uv run ect-daily

      - name: Access check (role accounts)
        # Acts as each role account to prove BigQuery enforces the access policy. Never fails the run.
        run: uv run ect-access-check

      - name: Build and test (dbt)
        id: dbt
        working-directory: data-platform/dbt
        run: uvx --from dbt-core==1.12.7 --with dbt-bigquery==1.12.4 dbt build

      - name: Sign in as the log reader (keyless)
        # A separate account (ect-monitor, Private Logs Viewer only), so the pipeline never reads its own
        # audit trail. Its credentials go only to the review step. Setup: docs/github-actions-setup.md, part H.
        id: monitor-auth
        if: ${{ always() && vars.GCP_MONITOR_SERVICE_ACCOUNT != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MONITOR_SERVICE_ACCOUNT }}
          export_environment_variables: false

      - name: Security review (POL-09)
        # Reviews yesterday's audit logs for the POL-09 Appendix A alerts. Never fails here: the last step does.
        if: always()
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.monitor-auth.outputs.credentials_file_path }}
          ECT_MAINTAINER_PRINCIPAL: ${{ secrets.ECT_MAINTAINER_PRINCIPAL }}
        run: uv run ect-security-review

      - name: Write run record
        if: always()
        run: uv run ect-record

      - name: Commit run record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-records
          git commit -m "Run record $(date -u +%F)" || { echo "Nothing to commit"; exit 0; }
          # main may have moved since checkout (e.g. a re-run, or an earlier record): rebase, then push
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail the run if the security review raised alerts
        # After the record is committed, so the evidence is kept. A failed run emails the maintainer.
        if: always()
        run: uv run ect-security-review --check
