name: Monthly configuration check

# Read-only check of the cloud project and repository settings against the policies (GOV-159).
# Writes data-platform/config-checks/<date>.md and saves it as evidence on the records branch (not main:
# main only changes through pull requests, GOV-77). Findings are recorded, not fixed;
# the run fails when there is a finding, so GitHub emails the maintainer. Setup: docs/github-actions-setup.md, part L.
on:
  schedule:
    - cron: "17 13 1 * *"   # 1st of each month, 08:17 New York (09:17 in summer)
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-platform
    steps:
      - uses: actions/checkout@v4
      - name: Get earlier results (records branch)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/get-records.sh"
      - name: Sign in as the log reader (keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_MONITOR_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen
      - name: Check settings (read-only)
        id: check
        env:
          ECT_MAINTAINER_PRINCIPAL: ${{ secrets.ECT_MAINTAINER_PRINCIPAL }}
        run: uv run ect-config-check
      - name: Save the result (records branch)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/save-records.sh" "Configuration check $(date -u +%F)"
      - name: Fail the run if there are findings
        run: uv run ect-config-check --check > /dev/null
