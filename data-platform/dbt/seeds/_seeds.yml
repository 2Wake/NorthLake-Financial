version: 2

seeds:
  - name: dq_rules
    description: Data-quality rule catalog. Source of truth for rule IDs, targets, severity, and which planted defect each rule should catch.
    config:
      labels: {domain: governance, layer: staging, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: governance, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}
    columns:
      - name: rule_id
        data_tests: [unique, not_null]
  - name: taxi_zone_supplement
    description: Taxi zones missing from the public zone table (see rules REF-01 to REF-03), with the reason for each.
    config:
      column_types: {zone_id: string}
      labels: {domain: reference, layer: staging, data_owner: data-governance-manager, data_steward: ops-data-steward, classification: public, source_system: reference, data_origin: public, contains_pii: "false", pci_scope: "false", retention: indefinite}
  - name: column_classification_register
    description: >
      The operational column classification register: one row per column in raw, staging and
      marts, with its classification, owner, steward and approval. Changed only by pull request
      (steward proposes, owner approves). Source for the classification checks.
    config:
      labels: {domain: governance, layer: staging, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: governance, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}
  - name: column_classification_answer_key
    description: >
      ANSWER KEY: the correct classification of every column. Used only by
      fct_classification_scorecard to score the register; checks must not read it.
    config:
      labels: {domain: governance, layer: staging, data_owner: data-governance-manager, data_steward: data-governance-manager, classification: internal, source_system: governance, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}
  - name: access_policy
    description: >
      Access policy matrix: which access role may use which dataset, at what privilege, approved by
      whom, and for how long. Used by the generator to create grants and by checks ACC-01 and ACC-07.
    config:
      labels: {domain: risk, layer: staging, data_owner: ciso, data_steward: risk-data-steward, classification: internal, source_system: governance, data_origin: synthetic, contains_pii: "false", pci_scope: "false", retention: indefinite}
