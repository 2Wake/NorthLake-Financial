# Connection settings. No secrets here: sign-in uses your Google login
# (gcloud auth application-default login), or keyless Workload Identity in GitHub Actions.
ect:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: empire-city-taxi
      dataset: staging          # default; models choose their dataset with +schema
      location: US
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 1000000000   # 1 GB hard cap per query (cost guardrail)
