name: ect
version: "0.1.0"
config-version: 2
profile: ect

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
clean-targets: ["target", "dbt_packages"]

# Label every BigQuery job dbt runs, so query costs can be traced to dbt.
query-comment:
  job-label: true

models:
  ect:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view

data_tests:
  ect:
    +severity: error
